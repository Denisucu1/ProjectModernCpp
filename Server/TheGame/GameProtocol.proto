syntax = "proto3";

package myproject;

message GameMessage{
	enum Type{
		ACTION = 0;
		STATE_UPDATE = 1;
		ERROR = 2;
	}
	Type type = 1;
	int32 user_id = 2;
	oneof payload {
		PlayerAction action = 3;
		GameState state = 4;
		string error_msg = 5;
	}
}

message PlayerAction {
	enum ActionType{
		PLAY_CARD = 0;
		DRAW_CARD = 1;
		END_TURN = 2;
	}
	ActionType action_type = 1;
	int32 card_id = 2;
	int32 stack_index = 3;
}

message GameState {
	int32 user_id = 1;
	int32 cards_remaining_in_deck = 2;
	repeated int32 stack_tops = 3;
	repeated PlayerInfo players = 4;
}

message PlayerInfo {
	int32 user_id = 1;
	int32 hand_size = 2;
	repeated int32 your_cards = 3;
}