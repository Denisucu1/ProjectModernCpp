syntax = "proto3";

package myproject;

message GameMessage {
    enum Type {
        ACTION = 0;
        STATE_UPDATE = 1;
        GAME_OVER = 2;
        ERROR = 3;
    }
    Type type = 1;
    int32 user_id = 2;
    oneof payload {
        PlayerAction action = 3;
        GameState state = 4;
        string error_msg = 5;
    }
}

message PlayerAction {
    enum ActionType {
        PLAY_CARD = 0;
        END_TURN = 1;
    }
    ActionType action_type = 1;
    int32 card_value = 2; 
    int32 stack_index = 3;
}

message GameState {
    enum Status {
        IN_PROGRESS = 0;
        WON = 1;
        LOST = 2;
    }
    Status game_status = 1;
    int32 current_player_id = 2;
    int32 cards_remaining_in_deck = 3;
    repeated int32 stack_tops = 4;
    repeated PlayerInfo players = 5;
}

message PlayerInfo {
    int32 user_id = 1;
    int32 hand_size = 2;
    repeated int32 your_cards = 3;
}